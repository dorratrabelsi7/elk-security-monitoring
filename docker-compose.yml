# ELK Security Monitoring : stack de développement (scénario C)
# Tous les secrets viennent du fichier .env (jamais versionné) : voir .env.example

name: elk-security

services:

  # --- Elasticsearch : stockage et recherche des logs ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elk-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - elk-net

  # --- Tâche unique : fixe le mot de passe du compte kibana_system, puis s'arrête ---
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elk-es-setup
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Configuration du compte kibana_system..."
        curl -sf -X POST -u "elastic:$${ELASTIC_PASSWORD}" \
          -H "Content-Type: application/json" \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" && echo "OK" || exit 1
    networks:
      - elk-net

  # --- Kibana : visualisations et dashboards ---
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: elk-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-setup:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    volumes:
      - kibanadata:/usr/share/kibana/data
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - elk-net

  # --- Logstash : lecture des fichiers déposés, transformation, envoi vers Elasticsearch ---
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: elk-logstash
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - XPACK_MONITORING_ENABLED=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./data/uploads:/usr/share/logstash/uploads
    ports:
      - "127.0.0.1:9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600 | grep -q '\"status\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - elk-net

  # --- MongoDB : métadonnées des fichiers, historique, comptes, IP à bloquer ---
  mongodb:
    image: mongo:${MONGO_VERSION}
    container_name: elk-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongodata:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - elk-net

  # --- Redis : sessions, cache de recherche, limitation de débit ---
  redis:
    image: redis:${REDIS_VERSION}
    container_name: elk-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - elk-net

  # --- Application web Flask : définie maintenant, démarrée à partir de T22 ---
  # Désactivée par défaut (profil "app") car le Dockerfile n'existe pas encore.
  # Activation plus tard : docker compose --profile app up -d
  webapp:
    profiles: ["app"]
    build: ./webapp
    container_name: elk-webapp
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${APP_SECRET_KEY}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB}
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - elk-net

networks:
  elk-net:
    driver: bridge

volumes:
  esdata:
  kibanadata:
  mongodata:
  redisdata:
